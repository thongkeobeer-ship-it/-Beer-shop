<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Accounts — NIMBUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flow-page" id="flowPage">
  <div class="flow-bg"><div class="flow-grid"></div></div>
  <div class="flow-orb flow-orb--1"></div>
  <div class="flow-orb flow-orb--2"></div>

  <section class="flow-step" id="stepAccounts" data-step="accounts">
    <header class="flow-header">
      <div class="flow-header-left">
        <a class="flow-back" id="accountsBackBtn" href="games.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="15" height="15"><path d="M15 6l-6 6 6 6"/></svg> Games</a>
        <div class="flow-header-info">
          <span class="flow-icon" id="accountsIcon"></span>
          <div>
            <h2 id="accountsTitle">Mobile Legends</h2>
            <p id="accountsSubtitle">0 Accounts Available</p>
          </div>
        </div>
      </div>
      <div class="flow-header-right">
        <a class="flow-icon-btn" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
      </div>
    </header>
    <div class="flow-toolbar">
      <div class="filter-chips" id="accountFilters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="newest">Newest</button>
        <button class="filter-chip" data-filter="cheapest">Cheapest</button>
        <button class="filter-chip" data-filter="rare">Rare</button>
        <button class="filter-chip" data-filter="highlevel">High Level</button>
        <button class="filter-chip" data-filter="premium">Premium</button>
      </div>
      <div class="toolbar-search"><input type="text" id="accountsSearchInput" placeholder="Search accounts…"></div>
    </div>
    <div class="flow-body"><div class="account-grid" id="accountGrid"></div></div>
  </section>
</div>

<script src="flow-data.js"></script>
<script src="flow-shell.js"></script>
<script src="accounts.js"></script>
</body>
</html>
